# Fabrique automatiquement l'application Mac C-SAFE sur les Mac de GitHub,
# puis publie un fichier C-SAFE.dmg à partager (onglet « Releases » du dépôt).
name: Fabriquer C-SAFE (Mac)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    # macos-26 : les machines macos-15 manquaient chez GitHub (novembre 2026)
    runs-on: macos-26
    outputs:
      sha: ${{ steps.dmgcheck.outputs.sha }}
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Version de Xcode
        run: xcodebuild -version

      - name: Compiler l'application (Apple Silicon + Intel)
        run: |
          set -o pipefail
          xcodebuild -project C-SAFE.xcodeproj -target C-SAFE -configuration Release -sdk macosx \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="1.${{ github.run_number }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            SYMROOT="$PWD/build" build 2>&1 | tee build.log
          test -x build/Release/C-SAFE.app/Contents/MacOS/C-SAFE

      - name: Erreurs Swift (lisibles dans les annotations)
        if: failure()
        run: |
          grep -E "\.swift:[0-9]+:[0-9]+: error|error: |BUILD FAILED|The following build commands failed" build.log | sort -u | head -60 | while IFS= read -r l; do
            echo "::error title=SWIFT::$(printf '%s' "$l" | sed 's#^.*/C-SAFE/C-SAFE/##' | cut -c1-900)"
          done

      - name: Garder le journal de compilation en cas d'erreur
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journal-compilation
          path: build.log

      - name: Tester le moteur de copie (2 Go, mémoire, vitesse, corbeille)
        run: |
          set -o pipefail
          if ! command -v ffmpeg >/dev/null; then
            mkdir -p "$HOME/bin"
            curl -fsSL https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-darwin-arm64.gz | gunzip > "$HOME/bin/ffmpeg" && chmod +x "$HOME/bin/ffmpeg" && export PATH="$HOME/bin:$PATH" || true
            "$HOME/bin/ffmpeg" -version 2>&1 | head -1 || true
          fi
          if command -v ffmpeg >/dev/null; then
            mkdir -p media
            F="ffmpeg -loglevel error -y"
            $F -f lavfi -i testsrc=size=1920x1080:rate=25 -t 3 -pix_fmt yuv420p -c:v libx264 media/a1.mp4
            $F -f lavfi -i smptehdbars=size=1920x1080:rate=25 -t 3 -pix_fmt yuv420p -c:v libx264 media/a2.mp4
            $F -f lavfi -i "mandelbrot=size=1920x1080:rate=25" -t 3 -pix_fmt yuv420p -c:v libx264 media/a3.mp4
            $F -f lavfi -i testsrc2=size=1920x1080:rate=25 -t 6 -pix_fmt yuv420p -c:v libx264 -timecode 10:16:31:00 media/b1.mov
            $F -f lavfi -i "cellauto=s=1920x1080:rate=25" -t 4 -pix_fmt yuv420p -c:v libx264 -timecode 10:20:05:00 media/b2.mov
            $F -f lavfi -i "sine=frequency=440:sample_rate=48000" -t 10 -c:a pcm_s24le -write_bext 1 -metadata time_reference=1775424000 media/son.wav
            $F -f lavfi -i testsrc=size=160x90 -frames:v 1 media/thumb.jpg
            ls -la media
          else echo "::warning title=TEST::ffmpeg absent, pas de vraies vidéos"; fi
          swiftc -O -swift-version 5 C-SAFE/Engine/Naming.swift C-SAFE/Engine/OffloadEngine.swift C-SAFE/Engine/PDFReport.swift Tests/main.swift -o enginetest
          status=0
          ./enginetest > test.log 2>&1 || status=$?
          cat test.log
          grep -E "^(TEST ÉCHEC|BILAN)" test.log | while IFS= read -r l; do echo "::error title=TEST::$l"; done
          grep -E "^(TEST OK|MESURE|RESULTAT)" test.log | head -9 | while IFS= read -r l; do echo "::notice title=TEST::$l"; done
          tail -5 test.log | while IFS= read -r l; do echo "::warning title=TEST-FIN::$l"; done
          exit $status

      - name: Publier les exemples de rapport PDF (version « apercu »)
        if: always()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apercu
          name: Aperçus iPhone / iPad
          prerelease: true
          make_latest: false
          files: exemple-rapport-*.pdf
          fail_on_unmatched_files: false

      - name: Signer (signature locale)
        run: |
          xattr -cr build/Release/C-SAFE.app
          codesign --force --deep --sign - --timestamp=none build/Release/C-SAFE.app
          codesign --verify --deep --strict --verbose=2 build/Release/C-SAFE.app

      - name: Diagnostic du paquet (lisible dans les annotations)
        if: always()
        run: |
          APP=build/Release/C-SAFE.app
          enc() { python3 -c 'import sys;print(sys.stdin.read()[:3500].replace("%","%25").replace("\r","").replace("\n","%0A"))'; }
          echo "::warning title=DIAG-arbo::$( (ls -la "$APP" "$APP"/Contents "$APP"/Contents/MacOS 2>&1; find "$APP" -maxdepth 2 2>&1 | head -40) | enc)"
          echo "::warning title=DIAG-plist::$(plutil -p "$APP"/Contents/Info.plist 2>&1 | enc)"
          echo "::warning title=DIAG-binaire::$( (file "$APP"/Contents/MacOS/* 2>&1; lipo -info "$APP"/Contents/MacOS/* 2>&1; otool -l "$APP"/Contents/MacOS/* 2>&1 | grep -A4 -E 'LC_BUILD_VERSION' | head -20) | enc)"
          echo "::warning title=DIAG-signature::$( (codesign -dvvv "$APP" 2>&1; spctl -a -vv "$APP" 2>&1; sw_vers) | enc)"
          echo "::warning title=DIAG-log::$(grep -E 'error|warning: |BUILD (SUCCEEDED|FAILED)|Xcode' build.log 2>&1 | sort -u | head -40 | enc)"

      - name: Créer le fichier C-SAFE.dmg
        run: |
          mkdir dmg
          ditto build/Release/C-SAFE.app dmg/C-SAFE.app
          ln -s /Applications dmg/Applications
          cp "Distribution/Installer C-SAFE.pdf" "dmg/Installer C-SAFE (à lire).pdf"
          hdiutil create -volname "C-SAFE" -srcfolder dmg -ov -format UDZO C-SAFE.dmg

      - name: Contrôler le .dmg (intégrité + signature de l'app à l'intérieur)
        id: dmgcheck
        run: |
          hdiutil verify C-SAFE.dmg
          MNT=$(hdiutil attach -nobrowse -readonly C-SAFE.dmg | tail -1 | cut -f3-)
          codesign --verify --deep --strict --verbose=2 "$MNT/C-SAFE.app"
          test -x "$MNT/C-SAFE.app/Contents/MacOS/C-SAFE"
          ls -la "$MNT"
          hdiutil detach "$MNT"
          SHA=$(shasum -a 256 C-SAFE.dmg | cut -d' ' -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "::notice title=SHA-256::$SHA"

      - name: Garder le .dmg
        uses: actions/upload-artifact@v4
        with:
          name: C-SAFE-mac
          path: C-SAFE.dmg


  ios:
    runs-on: macos-26
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Choisir le Xcode le plus récent (iOS 26)
        run: |
          ls -d /Applications/Xcode*.app | while read x; do echo "::notice title=XCODE::$x"; done
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
          echo "::notice title=XCODE-CHOISI::$(xcodebuild -version | tr '\n' ' ') · SDK iOS $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Compiler l'app iPhone / iPad (non signée, pour SideStore)
        run: |
          set -o pipefail
          xcodebuild -project C-SAFE.xcodeproj -target C-SAFE -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="1.${{ github.run_number }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            SYMROOT="$PWD/build-ios" build 2>&1 | tee build-ios.log
          APP=build-ios/Release-iphoneos/C-SAFE.app
          test -x "$APP/C-SAFE"
          mkdir -p ipa/Payload && ditto "$APP" ipa/Payload/C-SAFE.app
          (cd ipa && zip -qry ../C-SAFE.ipa Payload)
          echo "::notice title=IPA::$(du -h C-SAFE.ipa | cut -f1) · iOS min $(plutil -extract MinimumOSVersion raw $APP/Info.plist) · $(plutil -extract BGTaskSchedulerPermittedIdentifiers json -o - $APP/Info.plist 2>/dev/null)"

      - name: Erreurs iOS (lisibles dans les annotations)
        if: failure()
        run: |
          grep -E "\.swift:[0-9]+:[0-9]+: error|error: |BUILD FAILED" build-ios.log | sort -u | head -60 | while IFS= read -r l; do
            echo "::error title=IOS::$(printf '%s' "$l" | sed 's#^.*/C-SAFE/C-SAFE/##' | cut -c1-900)"
          done

      - name: Garder le .ipa
        uses: actions/upload-artifact@v4
        with:
          name: C-SAFE-ios
          path: C-SAFE.ipa

  apercu-iphone:
    # Captures du simulateur : seulement sur demande (« Run workflow »), pour ne pas occuper une machine Mac de plus
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    continue-on-error: true
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
      - name: Capture de l'app dans le simulateur iPhone
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1); [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -project C-SAFE.xcodeproj -target C-SAFE -configuration Debug -sdk iphonesimulator \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/build-sim" build > sim.log 2>&1 || { tail -30 sim.log; exit 1; }
          APP=build-sim/Debug-iphonesimulator/C-SAFE.app
          DEV=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];c=[x for k in d for x in d[k] if "iPhone" in x["name"] and "Pro" in x["name"] and "Max" not in x["name"]];print(c[-1]["udid"])')
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$APP"
          BID=$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")
          xcrun simctl launch "$DEV" "$BID"; sleep 12
          mkdir -p apercu
          xcrun simctl io "$DEV" screenshot apercu/iphone.png
          IPAD=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];c=[x for k in d for x in d[k] if "iPad Pro" in x["name"]];print(c[-1]["udid"] if c else "")')
          if [ -n "$IPAD" ]; then xcrun simctl boot "$IPAD"; xcrun simctl bootstatus "$IPAD" -b; xcrun simctl install "$IPAD" "$APP"; xcrun simctl launch "$IPAD" "$BID"; sleep 12; xcrun simctl io "$IPAD" screenshot apercu/ipad.png; fi
          ls -la apercu
      - name: Publier les captures (version « apercu », non affichée comme dernière version)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apercu
          name: Aperçus iPhone / iPad
          body: Captures automatiques de l'app dans le simulateur.
          prerelease: true
          make_latest: false
          files: apercu/*.png

  release:
    needs: [mac, ios]
    if: always() && needs.mac.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet (guides)
        uses: actions/checkout@v4

      - name: Récupérer les fichiers fabriqués
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Joindre le guide iPhone
        run: cp "Distribution/Installer C-SAFE sur iPhone.pdf" .

      - name: Ménage (anciens outils temporaires)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete outil-transcription --cleanup-tag -y || true
          gh api -X DELETE repos/${{ github.repository }}/git/refs/heads/outils-transcription || true

      - name: Publier la version à partager
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('version-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && format('C-SAFE {0}', github.ref_name) || format('C-SAFE — version {0}', github.run_number) }}
          body: |
            C-SAFE pour Mac (Apple Silicon et Intel), macOS 14 ou plus récent.

            Installation : ouvrir C-SAFE.dmg, glisser C-SAFE dans Applications.
            Premier lancement : si macOS bloque l'ouverture, aller dans
            Réglages Système > Confidentialité et sécurité > « Ouvrir quand même ».
            Guide illustré : « Installer C-SAFE (à lire).pdf » dans le .dmg.

            iPhone / iPad : C-SAFE.ipa, à installer avec AltStore (gratuit).
            Guide : « Installer C-SAFE sur iPhone.pdf ».

            Empreinte SHA-256 du fichier C-SAFE.dmg (pour vérifier qu'il n'a pas été modifié) :
            ${{ needs.mac.outputs.sha }}
          files: |
            C-SAFE.dmg
            C-SAFE.ipa
            Installer C-SAFE sur iPhone.pdf
          fail_on_unmatched_files: false
          make_latest: true
