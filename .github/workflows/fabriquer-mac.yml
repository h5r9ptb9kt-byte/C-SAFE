# Fabrique automatiquement l'application Mac C-SAFE sur les Mac de GitHub,
# puis publie un fichier C-SAFE.dmg à partager (onglet « Releases » du dépôt).
name: Fabriquer C-SAFE (Mac)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Version de Xcode
        run: xcodebuild -version

      - name: Compiler l'application (Apple Silicon + Intel)
        run: |
          set -o pipefail
          xcodebuild -project C-SAFE.xcodeproj -target C-SAFE -configuration Release -sdk macosx \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="1.${{ github.run_number }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            SYMROOT="$PWD/build" build 2>&1 | tee build.log
          test -x build/Release/C-SAFE.app/Contents/MacOS/C-SAFE

      - name: Erreurs Swift (lisibles dans les annotations)
        if: failure()
        run: |
          grep -E "\.swift:[0-9]+:[0-9]+: error|error: |BUILD FAILED|The following build commands failed" build.log | sort -u | head -60 | while IFS= read -r l; do
            echo "::error title=SWIFT::$(printf '%s' "$l" | sed 's#^.*/C-SAFE/C-SAFE/##' | cut -c1-900)"
          done

      - name: Garder le journal de compilation en cas d'erreur
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journal-compilation
          path: build.log

      - name: Tester le moteur de copie (2 Go, mémoire, vitesse, corbeille)
        run: |
          set -o pipefail
          swiftc -O -swift-version 5 C-SAFE/Engine/Naming.swift C-SAFE/Engine/OffloadEngine.swift Tests/main.swift -o enginetest
          status=0
          ./enginetest > test.log 2>&1 || status=$?
          cat test.log
          grep -E "^(TEST ÉCHEC|BILAN)" test.log | while IFS= read -r l; do echo "::error title=TEST::$l"; done
          grep -E "^(TEST OK|MESURE|RESULTAT)" test.log | head -9 | while IFS= read -r l; do echo "::notice title=TEST::$l"; done
          tail -5 test.log | while IFS= read -r l; do echo "::warning title=TEST-FIN::$l"; done
          exit $status

      - name: Signer (signature locale)
        run: |
          xattr -cr build/Release/C-SAFE.app
          codesign --force --deep --sign - --timestamp=none build/Release/C-SAFE.app
          codesign --verify --deep --strict --verbose=2 build/Release/C-SAFE.app

      - name: Diagnostic du paquet (lisible dans les annotations)
        if: always()
        run: |
          APP=build/Release/C-SAFE.app
          enc() { python3 -c 'import sys;print(sys.stdin.read()[:3500].replace("%","%25").replace("\r","").replace("\n","%0A"))'; }
          echo "::warning title=DIAG-arbo::$( (ls -la "$APP" "$APP"/Contents "$APP"/Contents/MacOS 2>&1; find "$APP" -maxdepth 2 2>&1 | head -40) | enc)"
          echo "::warning title=DIAG-plist::$(plutil -p "$APP"/Contents/Info.plist 2>&1 | enc)"
          echo "::warning title=DIAG-binaire::$( (file "$APP"/Contents/MacOS/* 2>&1; lipo -info "$APP"/Contents/MacOS/* 2>&1; otool -l "$APP"/Contents/MacOS/* 2>&1 | grep -A4 -E 'LC_BUILD_VERSION' | head -20) | enc)"
          echo "::warning title=DIAG-signature::$( (codesign -dvvv "$APP" 2>&1; spctl -a -vv "$APP" 2>&1; sw_vers) | enc)"
          echo "::warning title=DIAG-log::$(grep -E 'error|warning: |BUILD (SUCCEEDED|FAILED)|Xcode' build.log 2>&1 | sort -u | head -40 | enc)"

      - name: Créer le fichier C-SAFE.dmg
        run: |
          mkdir dmg
          ditto build/Release/C-SAFE.app dmg/C-SAFE.app
          ln -s /Applications dmg/Applications
          cp "Distribution/Installer C-SAFE.pdf" "dmg/Installer C-SAFE (à lire).pdf"
          hdiutil create -volname "C-SAFE" -srcfolder dmg -ov -format UDZO C-SAFE.dmg

      - name: Contrôler le .dmg (intégrité + signature de l'app à l'intérieur)
        run: |
          hdiutil verify C-SAFE.dmg
          MNT=$(hdiutil attach -nobrowse -readonly C-SAFE.dmg | tail -1 | cut -f3-)
          codesign --verify --deep --strict --verbose=2 "$MNT/C-SAFE.app"
          test -x "$MNT/C-SAFE.app/Contents/MacOS/C-SAFE"
          ls -la "$MNT"
          hdiutil detach "$MNT"
          SHA=$(shasum -a 256 C-SAFE.dmg | cut -d' ' -f1)
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "::notice title=SHA-256::$SHA"

      - name: Compiler l'app iPhone / iPad (non signée, pour SideStore)
        id: ios
        continue-on-error: true
        run: |
          set -o pipefail
          ls -d /Applications/Xcode*.app | while read x; do echo "::notice title=XCODE::$x"; done
          xcodebuild -project C-SAFE.xcodeproj -target C-SAFE -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="1.${{ github.run_number }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            SYMROOT="$PWD/build-ios" build 2>&1 | tee build-ios.log
          APP=build-ios/Release-iphoneos/C-SAFE.app
          test -x "$APP/C-SAFE"
          mkdir -p ipa/Payload && ditto "$APP" ipa/Payload/C-SAFE.app
          (cd ipa && zip -qry ../C-SAFE.ipa Payload)
          ls -la C-SAFE.ipa
          echo "::notice title=IPA::$(du -h C-SAFE.ipa | cut -f1) — $(plutil -extract MinimumOSVersion raw $APP/Info.plist)"

      - name: Erreurs iOS (lisibles dans les annotations)
        if: steps.ios.outcome == 'failure'
        run: |
          grep -E "\.swift:[0-9]+:[0-9]+: error|error: |BUILD FAILED" build-ios.log | sort -u | head -60 | while IFS= read -r l; do
            echo "::error title=IOS::$(printf '%s' "$l" | sed 's#^.*/C-SAFE/C-SAFE/##' | cut -c1-900)"
          done

      - name: Garder le .dmg
        uses: actions/upload-artifact@v4
        with:
          name: C-SAFE-mac
          path: C-SAFE.dmg

      - name: Publier la version à partager
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('version-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && format('C-SAFE {0}', github.ref_name) || format('C-SAFE — version {0}', github.run_number) }}
          body: |
            C-SAFE pour Mac (Apple Silicon et Intel), macOS 14 ou plus récent.

            Installation : ouvrir C-SAFE.dmg, glisser C-SAFE dans Applications.
            Premier lancement : si macOS bloque l'ouverture, aller dans
            Réglages Système > Confidentialité et sécurité > « Ouvrir quand même ».
            Guide illustré : « Installer C-SAFE (à lire).pdf » dans le .dmg.

            Empreinte SHA-256 du fichier C-SAFE.dmg (pour vérifier qu'il n'a pas été modifié) :
            ${{ env.SHA }}
          files: |
            C-SAFE.dmg
            C-SAFE.ipa
          fail_on_unmatched_files: false
          make_latest: true
